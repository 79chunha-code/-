<title>천사의 고원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 240x410 pixel screen, scaled up with hard pixels. Sky and angel on top, the fixed stage box in the middle,
   the talk panel and three actions below. Everything is drawn into an indexed framebuffer; the DOM only carries invisible buttons.
   Palette rule: the world is sky blue and white marble, light is the only yellow, shadow is the only ink navy, Rota is the only red. */
:root {
  --letterbox: #161b3d;
  --ink: #161b3d;
  --marble: #f6f8ff;
  --light: #ffd257;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--letterbox); color: var(--marble); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage {
  position: fixed; inset: 0; display: grid; place-items: center; box-sizing: border-box;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: none;
}
#field { position: relative; }
#c { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
/* Invisible hit areas. The canvas draws each button, including its focused look. */
.hit { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; font-size: 1px; overflow: hidden; cursor: pointer; outline: none; }
.hit:disabled { cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>

<div id="stage">
  <div id="field">
    <canvas id="c" width="240" height="410" role="img" aria-label="전투 화면"></canvas>
    <button class="hit" id="snd" type="button" hidden>소리 끄기</button>
    <button class="hit" id="actFight" type="button" data-act="fight" hidden>맞선다</button>
    <button class="hit" id="actJournal" type="button" data-act="journal" hidden>일지 펴기</button>
    <button class="hit" id="actSky" type="button" data-act="sky" hidden>하늘을 본다</button>
    <button class="hit" id="startBtn" type="button" hidden>일지를 덮고 일어선다</button>
    <button class="hit" id="jClose" type="button" hidden>일지를 덮고 맞선다</button>
    <button class="hit" id="retryBtn" type="button" hidden>이 차례부터 다시</button>
    <button class="hit" id="againBtn" type="button" hidden>처음부터 다시</button>
  </div>
</div>
<p class="sr" id="say" aria-live="polite"></p>

<script src="font.js"></script>
<script>
(function () {
  "use strict";
  // The simulation runs in a 480x820 logical field. The screen is exactly half of that: 240x410 pixels.
  const W = 480, H = 820, FW = 240, FH = 410, TAU = Math.PI * 2;
  const B = { x: 60, y: 284, w: 360, h: 258 };   // the stage box (logical)
  const BX = B.x / 2, BY = B.y / 2, BW = B.w / 2, BH = B.h / 2;
  const G = 62;          // graze radius: light closer than this casts Rota's shadow
  const AHIT = 44;       // shadow must pass within this of the angel
  const PMAX = 6, ENDURE = 8;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const q = (v) => Math.round(v / 2);            // logical -> screen pixel
  const cv = $("c"), ctx = cv.getContext("2d"), fieldEl = $("field"), stageEl = $("stage"), srEl = $("say");

  // ---------- Palette ----------
  const PAL = [
    "#000000", // 0 transparent in sprites
    "#161b3d", // 1 INK    outlines, shadows, text
    "#27306b", // 2 DEEP   weak shadow, secondary text
    "#3558b8", // 3 BLUE   pennant blue, emphasis
    "#4f86d9", // 4 SKY1
    "#6fa3e6", // 5 SKY2
    "#9cc3f2", // 6 SKY3
    "#cfe2fa", // 7 HAZE
    "#f6f8ff", // 8 WHITE  lit marble
    "#d7dff5", // 9 MARB1
    "#aebbe3", // 10 MARB2
    "#7f8dc6", // 11 MARB3
    "#ffd257", // 12 SUN   light
    "#fff1b0", // 13 SUNP
    "#fffbe6", // 14 SUNC
    "#f0932e", // 15 ORNG  edge of light
    "#df4b43", // 16 RED   Rota
    "#ff9a86", // 17 PINK
    "#4f9e58", // 18 GRN
    "#2f6b4a", // 19 GRND
    "#f2e4c0", // 20 PAPER journal
    "#dcc89a", // 21 PAPER2
    "#5a3a2a", // 22 BROWN
    "#96603c", // 23 BROWN2
    "#9c2a35", // 24 REDD
  ];
  const C = { INK: 1, DEEP: 2, BLUE: 3, SKY1: 4, SKY2: 5, SKY3: 6, HAZE: 7, WHITE: 8, MARB1: 9, MARB2: 10, MARB3: 11, SUN: 12, SUNP: 13, SUNC: 14, ORNG: 15,
    RED: 16, PINK: 17, GRN: 18, GRND: 19, PAPER: 20, PAPER2: 21, BROWN: 22, BROWN2: 23, REDD: 24 };
  const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const abgr = (r, g, b) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;
  const pal32 = new Uint32Array(PAL.map((h) => abgr(...rgb(h))));
  // impact frame: the whole screen snaps to two tones for a moment
  const palHit = new Uint32Array(PAL.map((h) => { const [r, g, b] = rgb(h); return 0.3 * r + 0.59 * g + 0.11 * b > 150 ? abgr(246, 248, 255) : abgr(22, 27, 61); }));

  // ---------- Pixel surface ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const surf = (w, h) => ({ w, h, d: new Uint8Array(w * h) });
  let S = null, cx0 = 0, cy0 = 0, cx1 = 0, cy1 = 0;
  function target(s) { S = s; cx0 = 0; cy0 = 0; cx1 = s.w; cy1 = s.h; }
  function setClip(x, y, w, h) { cx0 = Math.max(0, x); cy0 = Math.max(0, y); cx1 = Math.min(S.w, x + w); cy1 = Math.min(S.h, y + h); }
  function noClip() { cx0 = 0; cy0 = 0; cx1 = S.w; cy1 = S.h; }
  function px(x, y, c) { if (x >= cx0 && x < cx1 && y >= cy0 && y < cy1) S.d[y * S.w + x] = c; }
  // lv: dither level 1..16 (16 or undefined = solid)
  function rect(x, y, w, h, c, lv) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const x0 = Math.max(cx0, x), y0 = Math.max(cy0, y), x1 = Math.min(cx1, x + w), y1 = Math.min(cy1, y + h), d = S.d, sw = S.w;
    if (lv === undefined || lv >= 16) { for (let yy = y0; yy < y1; yy++) d.fill(c, yy * sw + x0, yy * sw + Math.max(x0, x1)); return; }
    for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) if (BAYER[(yy & 3) * 4 + (xx & 3)] < lv) d[yy * sw + xx] = c;
  }
  function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
  function line(x0, y0, x1, y1, c, dash) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy, i = 0;
    for (let n = 0; n < 2000; n++) {
      if (!dash || (i++ % dash) < (dash >> 1)) px(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
    }
  }
  function disc(cx, cy, r, c, lv) {
    cx = Math.round(cx); cy = Math.round(cy);
    const rr = r * r + r * 0.8;
    for (let y = -Math.ceil(r); y <= r; y++) { const hw = Math.floor(Math.sqrt(Math.max(0, rr - y * y))); if (y * y <= rr) rect(cx - hw, cy + y, hw * 2 + 1, 1, c, lv); }
  }
  function ring(cx, cy, r, c, dash) {
    cx = Math.round(cx); cy = Math.round(cy);
    const n = Math.max(8, Math.round(r * 6.4));
    let lx = null, ly = null, i = 0;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * TAU, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r);
      if (x === lx && y === ly) continue;
      lx = x; ly = y;
      if (!dash || (i++ % dash) < (dash >> 1)) px(x, y, c);
    }
  }
  // filled polygon, hard edges; p = [x0,y0,x1,y1,...]
  function poly(p, c, lv) {
    let minY = 1e9, maxY = -1e9; const n = p.length >> 1;
    for (let i = 0; i < n; i++) { minY = Math.min(minY, p[i * 2 + 1]); maxY = Math.max(maxY, p[i * 2 + 1]); }
    const ya = Math.max(cy0, Math.floor(minY)), yb = Math.min(cy1 - 1, Math.ceil(maxY)), xs = [];
    for (let y = ya; y <= yb; y++) {
      const sy = y + 0.5; xs.length = 0;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n, x1 = p[i * 2], y1 = p[i * 2 + 1], x2 = p[j * 2], y2 = p[j * 2 + 1];
        if ((y1 <= sy && y2 > sy) || (y2 <= sy && y1 > sy)) xs.push(x1 + (sy - y1) / (y2 - y1) * (x2 - x1));
      }
      xs.sort((a, b) => a - b);
      for (let i = 0; i + 1 < xs.length; i += 2) { const xa = Math.ceil(xs[i] - 0.5), xb = Math.floor(xs[i + 1] - 0.5); if (xb >= xa) rect(xa, y, xb - xa + 1, 1, c, lv); }
    }
  }
  // o.tint: draw every opaque pixel in one colour. o.lv: dither level.
  function blit(sp, x, y, o) {
    x = Math.round(x); y = Math.round(y);
    const tint = o && o.tint, lv = o && o.lv, d = S.d, sw = S.w, sd = sp.d, w = sp.w;
    for (let yy = 0; yy < sp.h; yy++) {
      const ty = y + yy; if (ty < cy0 || ty >= cy1) continue;
      for (let xx = 0; xx < w; xx++) {
        const c = sd[yy * w + xx]; if (!c) continue;
        const tx = x + xx; if (tx < cx0 || tx >= cx1) continue;
        if (lv !== undefined && BAYER[(ty & 3) * 4 + (tx & 3)] >= lv) continue;
        d[ty * sw + tx] = tint || c;
      }
    }
  }
  // put a 1px outline around everything opaque on a surface
  function outline(s, c) {
    const src = s.d.slice(), w = s.w, h = s.h, d = s.d;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      if ((x > 0 && src[y * w + x - 1]) || (x < w - 1 && src[y * w + x + 1]) || (y > 0 && src[(y - 1) * w + x]) || (y < h - 1 && src[(y + 1) * w + x])) d[y * w + x] = c;
    }
  }
  function spr(rows, map) {
    const s = surf(rows[0].length, rows.length);
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) s.d[y * s.w + x] = map[r[x]] || 0; });
    return s;
  }
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------- Pixel font (Galmuri, see font.js) ----------
  function mkFont(src, cap, pitch) {
    const idx = new Map(), recs = src.data.split(" "), cache = new Map();
    Array.from(src.chars).forEach((ch, i) => idx.set(ch, i));
    const f = { cap, pitch, glyph(ch) {
      let g = cache.get(ch); if (g) return g;
      const i = idx.get(ch); if (i === undefined) return ch === "?" ? null : f.glyph("?");
      const r = recs[i], bin = atob(r.slice(5));
      g = { adv: r.charCodeAt(0) - 48, w: r.charCodeAt(1) - 48, h: r.charCodeAt(2) - 48, xo: r.charCodeAt(3) - 56, yo: r.charCodeAt(4) - 56, bin };
      cache.set(ch, g); return g;
    } };
    return f;
  }
  const F11 = mkFont(window.GAME_FONTS.f11, 11, 14), F9 = mkFont(window.GAME_FONTS.f9, 9, 12);
  function textW(str, f, sc) { let w = 0; for (const ch of str) { const g = f.glyph(ch); if (g) w += g.adv; } return (w - 1) * (sc || 1); }
  function glyphAt(g, x, base, c, sc) {
    for (let r = 0, i = 0; r < g.h; r++) for (let k = 0; k < g.w; k++, i++) {
      if (g.bin.charCodeAt(i >> 3) & (0x80 >> (i & 7))) { if (sc === 1) px(x + g.xo + k, base - g.yo - g.h + r, c); else rect(x + (g.xo + k) * sc, base - (g.yo + g.h - r) * sc, sc, sc, c); }
    }
  }
  // y is the top of a capital/Hangul glyph
  function text(str, x, y, c, f, sc) {
    sc = sc || 1; x = Math.round(x); y = Math.round(y);
    for (const ch of str) { const g = f.glyph(ch); if (!g) continue; glyphAt(g, x, y + f.cap * sc, c, sc); x += g.adv * sc; }
    return x;
  }
  function textO(str, x, y, c, oc, f, sc) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) text(str, x + dx, y + dy, oc, f, sc);
    text(str, x, y, c, f, sc);
  }
  const textC = (str, cx, y, c, f, sc) => text(str, cx - textW(str, f, sc) / 2, y, c, f, sc);
  const textCO = (str, cx, y, c, oc, f, sc) => textO(str, Math.round(cx - textW(str, f, sc) / 2), y, c, oc, f, sc);
  // "<b>..</b>" marks emphasis. Returns lines of cells {ch, hl}; wraps at spaces, falls back to breaking a long word.
  function wrap(str, maxW, f) {
    const cells = []; let hl = false;
    for (let i = 0; i < str.length; i++) {
      if (str.startsWith("<b>", i)) { hl = true; i += 2; continue; }
      if (str.startsWith("</b>", i)) { hl = false; i += 3; continue; }
      cells.push({ ch: str[i], hl });
    }
    const adv = (c) => { const g = f.glyph(c.ch); return g ? g.adv : 0; };
    const lines = [[]]; let w = 0, i = 0;
    while (i < cells.length) {
      const cur = lines[lines.length - 1];
      if (cells[i].ch === " ") { if (cur.length) { cur.push(cells[i]); w += adv(cells[i]); } i++; continue; }
      let j = i, ww = 0; while (j < cells.length && cells[j].ch !== " ") { ww += adv(cells[j]); j++; }
      if (w + ww > maxW && cur.length) { lines.push([]); w = 0; continue; }
      if (ww > maxW) { for (; i < j; i++) { if (w + adv(cells[i]) > maxW) { lines.push([]); w = 0; } lines[lines.length - 1].push(cells[i]); w += adv(cells[i]); } continue; }
      for (; i < j; i++) cur.push(cells[i]);
      w += ww;
    }
    return lines;
  }
  function drawLines(lines, x, y, f, pitch, c, hc, limit) {
    let n = 0;
    for (const ln of lines) {
      let xx = x;
      for (const cell of ln) { if (limit !== undefined && n >= limit) return n; const g = f.glyph(cell.ch); if (g) { glyphAt(g, xx, y + f.cap, cell.hl ? hc : c, 1); xx += g.adv; } n++; }
      y += pitch;
    }
    return n;
  }

  // ---------- Layout ----------
  let cssPx = 1;   // css pixels per screen pixel
  function resize() {
    const cs = getComputedStyle(stageEl);
    const aw = stageEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = stageEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const dpr = window.devicePixelRatio || 1, s = Math.min(aw / FW, ah / FH), k = Math.floor(s * dpr);
    const whole = k >= 2 && k / (s * dpr) >= 0.85;          // whole device pixels per game pixel when it costs little size
    cssPx = whole ? k / dpr : s;
    // otherwise blow the picture up by a whole factor first and let the browser shrink it smoothly, so pixels stay even
    const mult = whole ? k : Math.max(2, Math.ceil(s * dpr));
    cv.width = FW * mult; cv.height = FH * mult; ctx.imageSmoothingEnabled = false;
    cv.style.imageRendering = whole ? "pixelated" : "auto";
    fieldEl.style.width = FW * cssPx + "px"; fieldEl.style.height = FH * cssPx + "px";
  }
  addEventListener("resize", resize);

  // ---------- Sound (square waves and noise, like an old console) ----------
  let ac = null, muted = false;
  function audioOn() {
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) { ac = null; }
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac || muted) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(dur, vol, freq) {
    if (!ac || muted) return;
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
  }
  const sfx = {
    strike(s, c) { const up = 1 + Math.min(c, 8) * 0.08; noise(0.1 + 0.08 * s, 0.3 + 0.3 * s, 700); tone(190, 45, 0.16 + 0.1 * s, "square", 0.1 + 0.08 * s); tone(520 * up, 780 * up, 0.09, "square", 0.05, 0.04); },
    tick() { tone(240, 150, 0.06, "square", 0.04); },
    hurt() { tone(220, 55, 0.28, "square", 0.09); noise(0.2, 0.2, 400); },
    select() { tone(660, 660, 0.04, "square", 0.035); },
    blip() { tone(420, 400, 0.03, "square", 0.018); },
    turn() { tone(660, 660, 0.09, "square", 0.04); tone(990, 990, 0.16, "square", 0.04, 0.09); },
    heal() { tone(520, 520, 0.08, "square", 0.04); tone(660, 660, 0.08, "square", 0.04, 0.08); tone(780, 780, 0.16, "square", 0.04, 0.16); },
    page() { noise(0.22, 0.12, 2400); },
  };

  // ---------- State ----------
  const P = { x: 0, y: 0, hp: PMAX, inv: 0, focus: false };
  const A = { x: W / 2, y: 150, hp: 100, ghost: 100, ghostT: 0, flash: 0, kx: 0, ky: 0, dying: 0 };
  let L = [], pend = [], parts = [], texts = [], sparks = [], shadows = [], timers = [];
  let state = "intro", overlay = "intro", simT = 0, freeze = 0, shake = 0, impact = 0, lastImpact = -9;
  let turn = 0, T = null, pat = null, nextKey = null, tele = false;
  let combo = 0, lastStrike = -9, turnHits = 0, totalHits = 0, bestCombo = 0, penAcc = 0;
  let jUses = 3, sUses = 2, snap = null, winStat = "";

  const after = (d, fn) => timers.push({ t: d, fn });
  const later = (d, fn, mark) => pend.push({ t: d, max: d, fn, mark });
  function orb(x, y, vx, vy, r) { L.push({ k: "orb", x, y, vx, vy, r: r || 7, best: 0, struck: false, fade: 0 }); }

  // ---------- Patterns ----------
  // Each pattern: name, dur, omen (menu text before it), hint (shown while it runs if the journal was read),
  // page (Caelum's journal lines, <b> marks emphasis), start/update. Positions are in the 480x820 logical field; B is the box.
  // To add a pattern, add an entry and put its key in ORDER.
  const PATTERNS = {
    rain: {
      name: "빛가루", dur: 9,
      omen: "천사가 날개를 턴다. 빛가루가 흩날린다.",
      hint: "빛이 곁을 스쳐 <b>발밑으로 지나간 직후</b>, 그림자가 위로 선다.",
      page: ["빛가루는 위에서 내린다네.", "곁을 스쳐 발밑으로 떨어지는 그 순간, 자네 그림자는 <b>하늘을 향해</b> 선다네.", "천사가 바로 머리 위에 있을 때를 노리게."],
      update(T, dt, lvl) {
        T.a = (T.a ?? 0.3) - dt;
        if (T.a > 0) return;
        T.a = 0.5 - 0.09 * lvl;
        const n = 2 + (lvl > 0 && Math.random() < 0.5 ? 1 : 0);
        for (let i = 0; i < n; i++) orb(rnd(B.x + 14, B.x + B.w - 14), B.y - 8, rnd(-12, 12), rnd(115, 140) + 22 * lvl, 7);
      },
    },
    rise: {
      name: "솟는 빛", dur: 9,
