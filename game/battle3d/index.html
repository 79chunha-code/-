<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>천사의 고원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The 3D plateau fills a landscape field; the interface is drawn in hard pixels on a canvas above it (480x270 and wider).
   Between turns a shadow-play cloth comes down over the fight. Gold is light, ink is shadow, red is Rota. */
:root { --night: #0e1230; color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--night); color: #f6f8ff; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage {
  position: fixed; inset: 0; box-sizing: border-box;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: none;
}
#field { position: absolute; touch-action: none; }
#gl, #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { image-rendering: pixelated; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="field">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="ui" width="480" height="270" role="img" aria-label="전투 화면"></canvas>
  </div>
</div>
<p class="sr" id="say" aria-live="polite"></p>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  // font.js sits next to the page when published; in the repository it lives with the pixel demo.
  // The battle's own scripts share one scope and are loaded in order.
  const parts = ["core.js", "world.js", "lights.js", "patterns.js", "stage.js", "main.js"];
  function load(srcs, ok, fail) {
    const s = document.createElement("script"); s.charset = "utf-8"; s.src = srcs[0]; s.onload = ok;
    s.onerror = () => (srcs.length > 1 ? load(srcs.slice(1), ok, fail) : fail(srcs[0]));
    document.body.appendChild(s);
  }
  const fail = (f) => { document.getElementById("say").textContent = f + "을(를) 불러오지 못했어요. 새로고침해 주세요."; };
  function next(i) { if (i < parts.length) load([parts[i]], () => next(i + 1), fail); }
  function boot() { load(["font.js", "../demo/font.js"], () => next(0), fail); }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
</script>
</body>
</html>
