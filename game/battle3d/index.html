<title>천사의 고원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the 3D plateau fills a 16:9 landscape field, rendered at 480x270 and enlarged with hard pixels.
   The interface is drawn at the same pixel size on a canvas above it: angel's light top left, talk panel bottom left,
   the three actions bottom right. Palette rule: yellow is light, ink navy is shadow and panels, red is Rota. */
:root {
  --night: #0e1230;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--night); color: #f6f8ff; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage {
  position: fixed; inset: 0; box-sizing: border-box;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: none;
}
#field { position: absolute; }
#gl, #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.hit { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; font-size: 1px; overflow: hidden; cursor: pointer; outline: none; }
.hit:disabled { cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>

<div id="stage">
  <div id="field">
    <canvas id="gl" width="480" height="270" aria-hidden="true"></canvas>
    <canvas id="ui" width="480" height="270" role="img" aria-label="전투 화면"></canvas>
    <button class="hit" id="snd" type="button" hidden>소리 끄기</button>
    <button class="hit" id="actFight" type="button" data-act="fight" hidden>맞선다</button>
    <button class="hit" id="actJournal" type="button" data-act="journal" hidden>일지 펴기</button>
    <button class="hit" id="actSky" type="button" data-act="sky" hidden>하늘 보기</button>
    <button class="hit" id="startBtn" type="button" hidden>일지를 덮고 일어선다</button>
    <button class="hit" id="jClose" type="button" hidden>일지를 덮고 맞선다</button>
    <button class="hit" id="retryBtn" type="button" hidden>이 차례부터 다시</button>
    <button class="hit" id="againBtn" type="button" hidden>처음부터 다시</button>
  </div>
</div>
<p class="sr" id="say" aria-live="polite"></p>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // font.js sits next to the page when published; in the repository it lives with the pixel demo
  function loadScript(srcs, ok, fail) {
    const s = document.createElement("script"); s.charset = "utf-8"; s.src = srcs[0]; s.onload = ok;
    s.onerror = () => (srcs.length > 1 ? loadScript(srcs.slice(1), ok, fail) : fail());
    document.head.appendChild(s);
  }
  function boot() { loadScript(["font.js", "../demo/font.js"], start, () => { $("say").textContent = "글꼴을 불러오지 못했어요. 새로고침해 주세요."; }); }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();

function start() {
  // The simulation runs in an 800x450 logical field, the same one the pixel demo used.

  let FW = CW, OX = 0;

  const G = 62, AHIT = 44, PMAX = 6, ENDURE = 8;

  const ANGEL_H = 3.1;                 // how high the angel hovers above the floor
  const CAM = { pos: [0, 10.4, 13.6], look: [0, 1.35, -2.1], fov: 33 };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  const stageEl = $("stage"), fieldEl = $("field"), glEl = $("gl"), uiEl = $("ui"), srEl = $("say"), uctx = uiEl.getContext("2d");

  // ---------- Interface palette (the world itself is 3D) ----------
  const PAL = ["#000000", "#12163a", "#232c66", "#3558b8", "#f6f8ff", "#cdd6f1", "#9aa8dc", "#6f7dbd", "#55629f", "#3f4a82",
    "#ffd257", "#fff1b0", "#fffbe6", "#f0932e", "#df4b43", "#ff9a86", "#f2e4c0", "#dcc89a", "#5a3a2a", "#96603c", "#9c2a35", "#6ea2e4"];
  const C = {};
  ["", "INK", "DEEP", "BLUE", "WHITE", "MARB1", "MARB2", "MARB3", "MARB4", "MARB5", "SUN", "SUNP", "SUNC", "ORNG", "RED", "PINK",
    "PAPER", "PAPER2", "BROWN", "BROWN2", "REDD", "SKY3"].forEach((n, i) => { if (n) C[n] = i; });
  const pal32 = new Uint32Array(PAL.map((h, i) => (i === 0 ? 0 : (0xff000000 | (parseInt(h.slice(5, 7), 16) << 16) | (parseInt(h.slice(3, 5), 16) << 8) | parseInt(h.slice(1, 3), 16)) >>> 0)));

  // ---------- Pixel surface ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const surf = (w, h) => ({ w, h, d: new Uint8Array(w * h) });
  // OFX shifts every x: the wide surfaces are addressed in content coordinates (0..400), with scenery beyond both ends
  let S = null, OFX = 0, cx0 = 0, cy0 = 0, cx1 = 0, cy1 = 0;
  function target(s, ofx) { S = s; OFX = ofx || 0; cx0 = 0; cy0 = 0; cx1 = s.w; cy1 = s.h; }

    const x0 = Math.max(cx0, x), y0 = Math.max(cy0, y), x1 = Math.min(cx1, x + w), y1 = Math.min(cy1, y + h), d = S.d, sw = S.w;

  }
  function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
  function line(x0, y0, x1, y1, c, dash) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy, i = 0;
    for (let n = 0; n < 2000; n++) {

    }
  }
  function disc(cx, cy, r, c, lv) {
    cx = Math.round(cx); cy = Math.round(cy);
    const rr = r * r + r * 0.8;
    for (let y = -Math.ceil(r); y <= r; y++) { const hw = Math.floor(Math.sqrt(Math.max(0, rr - y * y))); if (y * y <= rr) rect(cx - hw, cy + y, hw * 2 + 1, 1, c, lv); }
  }
  function ring(cx, cy, r, c, dash) {
    cx = Math.round(cx); cy = Math.round(cy);
    const n = Math.max(8, Math.round(r * 6.4));
    let lx = null, ly = null, i = 0;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * TAU, x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r);
      if (x === lx && y === ly) continue;

      if (!dash || (i++ % dash) < (dash >> 1)) px(x, y, c);

  }
  // filled polygon, hard edges; p = [x0,y0,x1,y1,...]
  function poly(p, c, lv) {
    let minY = 1e9, maxY = -1e9; const n = p.length >> 1;
    for (let i = 0; i < n; i++) { minY = Math.min(minY, p[i * 2 + 1]); maxY = Math.max(maxY, p[i * 2 + 1]); }
    const ya = Math.max(cy0, Math.floor(minY)), yb = Math.min(cy1 - 1, Math.ceil(maxY)), xs = [];
    for (let y = ya; y <= yb; y++) {
      const sy = y + 0.5; xs.length = 0;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n, x1 = p[i * 2], y1 = p[i * 2 + 1], x2 = p[j * 2], y2 = p[j * 2 + 1];
        if ((y1 <= sy && y2 > sy) || (y2 <= sy && y1 > sy)) xs.push(x1 + (sy - y1) / (y2 - y1) * (x2 - x1));
      }

    }
  }
  // o.tint: draw every opaque pixel in one colour. o.lv: dither level.
  function blit(sp, x, y, o) {
    x = Math.round(x) + OFX; y = Math.round(y);
    const tint = o && o.tint, lv = o && o.lv, d = S.d, sw = S.w, sd = sp.d, w = sp.w;
    for (let yy = 0; yy < sp.h; yy++) {
      const ty = y + yy; if (ty < cy0 || ty >= cy1) continue;
      for (let xx = 0; xx < w; xx++) {
        const c = sd[yy * w + xx]; if (!c) continue;
        const tx = x + xx; if (tx < cx0 || tx >= cx1) continue;
        if (lv !== undefined && BAYER[(ty & 3) * 4 + (tx & 3)] >= lv) continue;
        d[ty * sw + tx] = tint || c;
      }
    }
  }
  // put a 1px outline around everything opaque on a surface
  function outline(s, c) {
    const src = s.d.slice(), w = s.w, h = s.h, d = s.d;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      if ((x > 0 && src[y * w + x - 1]) || (x < w - 1 && src[y * w + x + 1]) || (y > 0 && src[(y - 1) * w + x]) || (y < h - 1 && src[(y + 1) * w + x])) d[y * w + x] = c;
    }
  }
  function spr(rows, map) {
    const s = surf(rows[0].length, rows.length);
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) s.d[y * s.w + x] = map[r[x]] || 0; });
    return s;
  }
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---------- Pixel font (Galmuri, see font.js) ----------
  function mkFont(src, cap, pitch) {
    const idx = new Map(), recs = src.data.split(" "), cache = new Map();
    Array.from(src.chars).forEach((ch, i) => idx.set(ch, i));
    const f = { cap, pitch, glyph(ch) {
      let g = cache.get(ch); if (g) return g;
      const i = idx.get(ch); if (i === undefined) return ch === "?" ? null : f.glyph("?");
      const r = recs[i], bin = atob(r.slice(5));
      g = { adv: r.charCodeAt(0) - 48, w: r.charCodeAt(1) - 48, h: r.charCodeAt(2) - 48, xo: r.charCodeAt(3) - 56, yo: r.charCodeAt(4) - 56, bin };
      cache.set(ch, g); return g;
    } };

  }
  const F11 = mkFont(window.GAME_FONTS.f11, 11, 14), F9 = mkFont(window.GAME_FONTS.f9, 9, 12);
  function textW(str, f, sc) { let w = 0; for (const ch of str) { const g = f.glyph(ch); if (g) w += g.adv; } return (w - 1) * (sc || 1); }
  function glyphAt(g, x, base, c, sc) {
    for (let r = 0, i = 0; r < g.h; r++) for (let k = 0; k < g.w; k++, i++) {
      if (g.bin.charCodeAt(i >> 3) & (0x80 >> (i & 7))) { if (sc === 1) px(x + g.xo + k, base - g.yo - g.h + r, c); else rect(x + (g.xo + k) * sc, base - (g.yo + g.h - r) * sc, sc, sc, c); }
    }
  }
  // y is the top of a capital/Hangul glyph
  function text(str, x, y, c, f, sc) {
    sc = sc || 1; x = Math.round(x); y = Math.round(y);
    for (const ch of str) { const g = f.glyph(ch); if (!g) continue; glyphAt(g, x, y + f.cap * sc, c, sc); x += g.adv * sc; }
    return x;
  }
  function textO(str, x, y, c, oc, f, sc) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) text(str, x + dx, y + dy, oc, f, sc);
    text(str, x, y, c, f, sc);
  }
  const textC = (str, cx, y, c, f, sc) => text(str, cx - textW(str, f, sc) / 2, y, c, f, sc);
  const textCO = (str, cx, y, c, oc, f, sc) => textO(str, Math.round(cx - textW(str, f, sc) / 2), y, c, oc, f, sc);
  // "<b>..</b>" marks emphasis. Returns lines of cells {ch, hl}; wraps at spaces, falls back to breaking a long word.
  function wrap(str, maxW, f) {
    const cells = []; let hl = false;
    for (let i = 0; i < str.length; i++) {
      if (str.startsWith("<b>", i)) { hl = true; i += 2; continue; }
      if (str.startsWith("</b>", i)) { hl = false; i += 3; continue; }
      cells.push({ ch: str[i], hl });

      const cur = lines[lines.length - 1];

      let j = i, ww = 0; while (j < cells.length && cells[j].ch !== " ") { ww += adv(cells[j]); j++; }
      if (w + ww > maxW && cur.length) { lines.push([]); w = 0; continue; }
      if (ww > maxW) { for (; i < j; i++) { if (w + adv(cells[i]) > maxW) { lines.push([]); w = 0; } lines[lines.length - 1].push(cells[i]); w += adv(cells[i]); } continue; }
      for (; i < j; i++) cur.push(cells[i]);

  }
  function drawLines(lines, x, y, f, pitch, c, hc, limit) {
    let n = 0;
    for (const ln of lines) {

      for (const cell of ln) { if (limit !== undefined && n >= limit) return n; const g = f.glyph(cell.ch); if (g) { glyphAt(g, xx, y + f.cap, cell.hl ? hc : c, 1); xx += g.adv; } n++; }
      y += pitch;
    }
    return n;
  }


  // ---------- Layout ----------
  let cssPx = 1, rot = false, ui = null, uimg = null, uout = null;
  let touch = matchMedia("(pointer: coarse)").matches;
  function resize() {
    const cs = getComputedStyle(stageEl);
    const pl = parseFloat(cs.paddingLeft), pt = parseFloat(cs.paddingTop);
    let aw = stageEl.clientWidth - pl - parseFloat(cs.paddingRight), ah = stageEl.clientHeight - pt - parseFloat(cs.paddingBottom);
    const midX = pl + aw / 2, midY = pt + ah / 2;
    rot = touch && ah > aw * 1.15;            // a phone held upright shows the game turned on its side
    if (rot) [aw, ah] = [ah, aw];
    const fw = clamp(Math.round((FH * aw) / ah / 2) * 2, CW, 640);   // wider screens see more of the plateau, same fight
    if (fw !== FW || !ui) {
      FW = fw; OX = (FW - CW) / 2;
      ui = surf(FW, FH); uiEl.width = FW; uiEl.height = FH;
      uimg = uctx.createImageData(FW, FH); uout = new Uint32Array(uimg.data.buffer);

  // ---------- Sound (square waves and noise, like an old console) ----------

  let noiseBuf = null;
  function noise(dur, vol, freq) {
    if (!ac || muted) return;

    strike(s, c) { const up = 1 + Math.min(c, 8) * 0.08; noise(0.1 + 0.08 * s, 0.3 + 0.3 * s, 700); tone(190, 45, 0.16 + 0.1 * s, "square", 0.1 + 0.08 * s); tone(520 * up, 780 * up, 0.09, "square", 0.05, 0.04); },
    tick() { tone(240, 150, 0.06, "square", 0.04); },
    hurt() { tone(220, 55, 0.28, "square", 0.09); noise(0.2, 0.2, 400); },
    select() { tone(660, 660, 0.04, "square", 0.035); },
    blip() { tone(420, 400, 0.03, "square", 0.018); },
    turn() { tone(660, 660, 0.09, "square", 0.04); tone(990, 990, 0.16, "square", 0.04, 0.09); },
    heal() { tone(520, 520, 0.08, "square", 0.04); tone(660, 660, 0.08, "square", 0.04, 0.08); tone(780, 780, 0.16, "square", 0.04, 0.16); },
    page() { noise(0.22, 0.12, 2400); },

  // ---------- State ----------
  const P = { x: MX, y: B.y + B.h * 0.7, hp: PMAX, inv: 0, focus: false, face: 0, moving: 0 };
  const A = { x: MX, y: AY, hp: 100, ghost: 100, ghostT: 0, flash: 0, kx: 0, ky: 0, dying: 0 };
  let L = [], pend = [], texts = [], shadows = [], timers = [];
  let state = "loading", overlay = null, simT = 0, freeze = 0, shake = 0, impact = 0, lastImpact = -9, loadPct = 0, loadErr = "";
  let turn = 0, T = null, pat = null, nextKey = null, tele = false;
  let combo = 0, lastStrike = -9, turnHits = 0, totalHits = 0, bestCombo = 0, penAcc = 0;
  let jUses = 3, sUses = 2, snap = null, winStat = "";

  // ---------- Patterns ----------
  // Each pattern: name, dur, omen (menu text before it), hint (shown while it runs if the journal was read),
  // page (Caelum's journal lines, <b> marks emphasis), start/update. Positions are in the 480x820 logical field; B is the box.
  // To add a pattern, add an entry and put its key in ORDER.
  const PATTERNS = {
    rain: {
      name: "빛가루", dur: 9,
      omen: "천사가 날개를 턴다. 빛가루가 흩날린다.",
      hint: "빛이 곁을 스쳐 <b>발밑으로 지나간 직후</b>, 그림자가 위로 선다.",
      page: ["빛가루는 위에서 내린다네.", "곁을 스쳐 발밑으로 떨어지는 그 순간, 자네 그림자는 <b>하늘을 향해</b> 선다네.", "천사가 바로 머리 위에 있을 때를 노리게."],
      update(T, dt, lvl) {

  function burst3(at, n, sp, life, kind) {
    for (let i = 0; i < n; i++) {
      let s = shards.find((q) => !q.mesh.visible);
      if (!s) { s = { mesh: add(new THREE.Mesh(shardGeo, shardMats.ink)), v: new THREE.Vector3(), life: 0, max: 1, spin: new THREE.Vector3() }; shards.push(s); }
      s.mesh.material = shardMats[kind]; s.mesh.visible = true; s.mesh.position.copy(at);
      const a = Math.random() * TAU, e = rnd(-0.4, 1), v = sp * rnd(0.35, 1);
      s.v.set(Math.cos(a) * v, e * v, Math.sin(a) * v); s.life = s.max = life * rnd(0.6, 1);
      s.spin.set(rnd(-12, 12), rnd(-12, 12), rnd(-12, 12)); s.mesh.scale.setScalar(rnd(0.6, 1.4));
    }
  }
  const spikeGeo = new THREE.ConeGeometry(0.32, 1, 5); spikeGeo.translate(0, 0.5, 0);
  const spikes = [];
  // a shard of shadow rises from the angel's own shadow on the floor and runs it through
  function spike(at, s) {
    let k = spikes.find((q) => !q.mesh.visible);
    if (!k) { k = { mesh: add(new THREE.Mesh(spikeGeo, basic("#07081c", { depthWrite: true, opacity: 1 }))), t: 0 }; spikes.push(k); }
    k.mesh.visible = true; k.t = 0; k.s = s; k.mesh.position.set(at.x, Y0 + 0.02, at.z); k.h = at.y - Y0 + 0.3;
    k.mesh.rotation.set(rnd(-0.12, 0.12), rnd(0, TAU), rnd(-0.12, 0.12));
  }
  function stepFx(dt) {
    for (const s of shards) if (s.mesh.visible) {
      s.life -= dt; if (s.life <= 0) { s.mesh.visible = false; continue; }
      s.v.y -= 9 * dt; s.v.multiplyScalar(Math.exp(-dt * 1.5));
      s.mesh.position.addScaledVector(s.v, dt);
      if (s.mesh.position.y < Y0 + 0.03) { s.mesh.position.y = Y0 + 0.03; s.v.y *= -0.3; s.v.x *= 0.6; s.v.z *= 0.6; }
      s.mesh.rotation.x += s.spin.x * dt; s.mesh.rotation.y += s.spin.y * dt;
    }
    for (const k of spikes) if (k.mesh.visible) {
      k.t += dt;
      const grow = clamp(k.t / 0.05, 0, 1), fade = clamp((k.t - 0.12) / 0.22, 0, 1);
      const w = (0.6 + 0.8 * k.s) * (1 - fade * 0.7);
      k.mesh.scale.set(w, k.h * grow, w); k.mesh.material.opacity = 1 - fade;
      if (k.t > 0.34) k.mesh.visible = false;
    }
  }

  // ---------- Plateau model ----------
  function loadWorld(urls) {
    new THREE.GLTFLoader().load(urls[0], (g) => {
      const root = g.scene; scene.add(root);
      root.traverse((o) => { if (o.isMesh) { o.material.side = THREE.FrontSide; } });
      // find the top of the dais: cast a ray straight down at the plateau's centre
      root.updateMatrixWorld(true);
      const rc = new THREE.Raycaster(new THREE.Vector3(0, 400, 0), new THREE.Vector3(0, -1, 0));
      const hits = rc.intersectObject(root, true).filter((h) => !/Cloud|Bunting/.test(h.object.name + (h.object.parent ? h.object.parent.name : "")));
      Y0 = hits.length ? hits[0].point.y : 0;
      buildArena();
      state = "intro"; showOverlay("intro");
    }, (e) => { if (e.total) loadPct = e.loaded / e.total; }, () => {
      if (urls.length > 1) loadWorld(urls.slice(1)); else loadErr = "고원 모델을 불러오지 못했어요. 새로고침해 주세요.";
    });
  }

  function render3D(dt) {
    // angel
    const aw = angelWorld();
    let k = 1;
    if (state === "victory") k = Math.max(0, 1 - A.dying / 2.6);
    if (state === "won") k = 0;
    angel.visible = k > 0;
    angel.position.copy(aw);
    angel.scale.setScalar(0.85 * (0.4 + 0.6 * k));
    angel.rotation.y = Math.sin(simT * 0.7) * 0.15;
    const flap = Math.sin(simT * 3.2) * 0.16;
    angel.userData.wings.forEach((w, i) => { w.rotation.z = (i ? -1 : 1) * flap; w.rotation.y = (i ? 1 : -1) * 0.25; });
    angel.userData.halo.rotation.z = simT * 0.8;
    const dim = A.hp <= 30 && Math.floor(simT * 8) % 2 === 0;
    angel.userData.heart.material.color.copy(dim ? col("#f0932e") : col("#ffd257"));
    const flash = A.flash > 0.45 ? (Math.floor(A.flash * 12) % 2 ? INKD : WHITEC) : null;
    angel.userData.aura.material.opacity = 0.55 * k * (A.hp / 100 * 0.6 + 0.4);
    for (const mt of angelMats) {
      mt.color.copy(flash || (mt.userData.dark ? INKC : mt.userData.base));
      mt.emissiveIntensity = flash === WHITEC ? 1 : flash ? 0 : mt.userData.dark ? 0.04 : 0.55;
      mt.opacity = k;
    }
    if (state === "victory" && Math.random() < 0.6) burst3(aw.clone().add(new THREE.Vector3(rnd(-1.2, 1.2), rnd(-1.2, 1.2), 0)), 2, 2.5, 1.0, Math.random() < 0.5 ? "ink" : "gold");
    angelL.position.set(aw.x, aw.y + 0.3, aw.z + 0.8); angelL.intensity = 2.2 * k * (dim ? 0.6 : 1);
    angelShadow.position.set(wx(A.x + A.kx), Y0 + 0.03, wz(A.y + A.ky)); angelShadow.material.opacity = 0.5 * k;
    angelRing.position.set(angelShadow.position.x, Y0 + 0.035, angelShadow.position.z);
    // Rota
    const showR = !(state === "down" || state === "intro" || state === "won" || state === "loading");
    const blink = P.inv > 0 && state === "pattern" && !reduceMotion && Math.floor(P.inv * 14) % 2 === 0;
    rota.visible = showR && !blink;
    const rx = wx(P.x), rz = wz(P.y);
    rota.position.set(rx, Y0 + Math.abs(Math.sin(simT * 14)) * 0.035 * P.moving, rz);
    let dr = P.face - rota.rotation.y; dr = ((dr + Math.PI) % TAU + TAU) % TAU - Math.PI; rota.rotation.y += dr * Math.min(1, dt * 14);
    rotaDot.visible = showR && state === "pattern"; rotaDot.position.set(rx, Y0 + 0.05, rz);
    focusRing.visible = showR && P.focus && state === "pattern"; focusRing.position.set(rx, Y0 + 0.045, rz);
    // lights, telegraphs, shadows
    syncLights(); syncMarks();
    const aligned = syncShadows();
    angelRing.material.opacity = (aligned ? 0.95 : state === "pattern" && tele ? 0.45 : 0) * k;
    angelRing.material.color.copy(aligned ? col("#ffd257") : col("#f6f8ff"));
    syncGuides(); stepFx(dt);
    // camera, with a slight drift so the scene breathes
    const sh = shake > 0.005 ? shake : 0;
    cam.position.set(CAM.pos[0] + Math.sin(simT * 0.21) * 0.25 + rnd(-sh, sh), CAM.pos[1] + rnd(-sh, sh), CAM.pos[2]);
    cam.position.y += Y0;
    cam.lookAt(CAM.look[0], Y0 + CAM.look[1], CAM.look[2]);
    glEl.style.filter = impact > 0 ? "grayscale(1) contrast(6) brightness(1.05)" : "";
    renderer.render(scene, cam);
  }

  // ---------- Interface ----------
  const hitEls = {};
  ["snd", "actFight", "actJournal", "actSky", "startBtn", "jClose", "retryBtn", "againBtn"].forEach((id) => (hitEls[id] = { el: $(id), key: "", on: false }));
  function place(id, x, y, w, h, off) {
    const o = hitEls[id], key = x + "," + y + "," + w + "," + h;
    o.on = true;
    if (o.key !== key) { o.key = key; Object.assign(o.el.style, { left: ((x + OX) / FW) * 100 + "%", top: (y / FH) * 100 + "%", width: (w / FW) * 100 + "%", height: (h / FH) * 100 + "%" }); }
    if (o.el.hidden) o.el.hidden = false;
    if (o.el.disabled !== !!off) o.el.disabled = !!off;
  }
  function endPlace() {
    for (const id in hitEls) { const o = hitEls[id]; if (!o.on && !o.el.hidden) o.el.hidden = true; o.on = false; }
    if (wantFocus) { const el = $(wantFocus); if (!el.hidden && !el.disabled) el.focus({ preventScroll: true }); wantFocus = null; }
  }
  const focused = (id) => document.activeElement && document.activeElement.id === id;
  function slab(x, y, w, h, fill, edge) { rect(x - 1, y - 1, w + 2, h + 2, C.INK); rect(x, y, w, h, edge); rect(x + 1, y + 1, w - 2, h - 2, fill); }
  const soul = (x, y) => { rect(x, y, 5, 5, C.RED); rect(x, y, 2, 1, C.PINK); px(x, y + 1, C.PINK); };
  const ICON = { "#": C.WHITE };
  const icoOn = spr(["...#.....", "..##..#..", "####...#.", "####.#.#.", "####...#.", "..##..#..", "...#....."], ICON);
  const icoOff = spr(["...#.....", "..##.#.#.", "####.....", "####..#..", "####.....", "..##.#.#.", "...#....."], ICON);
  const RIGHT = () => CW + OX - 8;     // panels hug the real screen edges on wide phones
  const LEFT = () => 8 - OX;
  function project(p) { const v = p.clone().project(cam); return [Math.round((v.x + 1) / 2 * FW - OX), Math.round((1 - v.y) / 2 * FH), v.z < 1]; }
  function drawTexts() {
    for (const t of texts) {
      const [x, y0, vis] = project(t.p); if (!vis) continue;
      const age = t.max - t.life;
      if (t.kind === "note") { textCO(t.txt, x, y0 - Math.round(age * 6), C.WHITE, C.INK, F9, 1); continue; }
      const hop = Math.round(Math.max(0, Math.sin(Math.min(1, age / 0.4) * Math.PI)) * 9);
      if (t.life < 0.25 && Math.floor(t.life * 30) % 2) continue;
      if (t.kind === "big") textCO(t.txt, x, y0 - hop - 8, C.SUN, C.INK, F11, 2); else textCO(t.txt, x, y0 - hop, C.WHITE, C.INK, F11, 1);
    }
    if (combo >= 2 && simT - lastStrike < 1.6 && state === "pattern") {
      const fresh = simT - lastStrike < 0.1, [x, y] = project(angelWorld().add(new THREE.Vector3(0, -2.0, 0)));
      textCO("그림자 " + combo + "연타", x, y - (fresh ? 2 : 0), fresh ? C.SUN : C.WHITE, C.INK, F11, 1);
    }
  }
  function drawHud() {
    if (state === "loading") {
      const msg = loadErr || "고원으로 오르는 중 " + Math.round(loadPct * 100) + "%";
      textCO(msg, CW / 2, FH / 2 - 6, C.WHITE, C.INK, F11, 1);
      return;
    }
    if (state === "intro" || state === "won") return;
    const lx = LEFT(), rx = RIGHT();
    // the angel's light
    slab(lx, 6, 170, 13, C.INK, C.WHITE);
    text("천사", lx + 4, 8, C.WHITE, F9);
    const bx = lx + 28, bw = 112;
    rect(bx, 10, bw, 5, C.MARB5);
    const gw = Math.round(bw * A.ghost / 100), hw = Math.round(bw * A.hp / 100);
    rect(bx, 10, gw, 5, C.RED); rect(bx, 10, hw, 5, C.SUN); if (hw > 0) { rect(bx, 10, hw, 1, C.SUNP); rect(bx, 14, hw, 1, C.ORNG); }
    const num = String(Math.ceil(A.hp)); text(num, lx + 166 - textW(num, F9), 8, C.WHITE, F9);
    if (state === "pattern") { const tw = Math.round(170 * (1 - clamp(T.t / pat.dur, 0, 1))); rect(lx - 1, 22, 172, 4, C.INK); rect(lx, 23, tw, 2, C.SKY3); }
    slab(rx - 16, 6, 16, 13, C.INK, focused("snd") ? C.SUN : C.WHITE);
    blit(muted ? icoOff : icoOn, rx - 12, 9);
    place("snd", rx - 19, 3, 22, 19);
    // while Rota dodges, the panels step aside: only the breath stays, and the journal's hint if one was read
    if (!["menu", "sky", "journal"].includes(state)) {
      slab(lx, FH - 20, 80, 13, C.INK, C.WHITE);
      text("로타", lx + 4, FH - 18, C.WHITE, F9);
      for (let i = 0; i < PMAX; i++) { const x = lx + 28 + i * 8; if (i < P.hp) { rect(x, FH - 17, 6, 6, C.RED); rect(x, FH - 17, 2, 1, C.PINK); px(x, FH - 16, C.PINK); } else frame(x, FH - 17, 6, 6, C.MARB5); }
      if (sayLay && (tele || state !== "pattern")) {
        const n = sayLay.reduce((m, l) => m + l.length, 0), hh = n * 12 + 8;
        slab(lx, 30, 132, hh, C.INK, C.WHITE);
        let y = 34;
        for (const lines of sayLay) { drawLines(lines, lx + 5, y, F9, 12, C.WHITE, C.SUN); y += lines.length * 12; }
      }
      return;
    }
    // bottom left: Rota's breath and the talk panel
    const py = 186, pw = 132, ph = 78;
    slab(lx, py, pw, ph, C.INK, C.WHITE);
    text("로타", lx + 5, py + 5, C.WHITE, F9);
    for (let i = 0; i < PMAX; i++) { const x = lx + 29 + i * 8; if (i < P.hp) { rect(x, py + 6, 6, 6, C.RED); rect(x, py + 6, 2, 1, C.PINK); px(x, py + 7, C.PINK); } else frame(x, py + 6, 6, 6, C.MARB5); }
    const tn = "차례 " + (turn + 1); text(tn, lx + pw - 5 - textW(tn, F9), py + 5, C.MARB2, F9);
    rect(lx + 4, py + 18, pw - 8, 1, C.MARB5);
    if (sayLay) {
      let y = py + 23, left = Math.floor(sayN);
      for (const lines of sayLay) {
        if (left <= 0) break;
        text("*", lx + 5, y, C.MARB3, F9);
        left -= drawLines(lines, lx + 13, y, F9, 12, C.WHITE, C.SUN, left);
        y += lines.length * 12 + 2;
      }
    }
    // bottom right: three actions
    const acts = [["actFight", "맞선다", "빛 속으로"], ["actJournal", "일지 펴기", jUses + "장 남음"], ["actSky", "하늘 보기", sUses > 0 && P.hp >= PMAX ? "숨이 고르다" : sUses + "번 남음"]];
    acts.forEach(([id, label, sub], i) => {
      const w = 78, h = 24, x = rx - w, y = 186 + i * 27, off = actOff(id), sel = !off && focused(id);
      slab(x, y, w, h, C.INK, sel ? C.SUN : off ? C.MARB5 : C.WHITE);
      const lc = sel ? C.SUN : off ? C.MARB4 : C.WHITE;
      text(label, x + 13, y + 3, lc, F9);
      text(sub, x + 13, y + 13, sel ? C.SUNP : off ? C.MARB5 : C.MARB2, F9);
      if (sel) soul(x + 4, y + 9);
      place(id, x - 1, y - 1, w + 2, h + 2, off);
    });
  }
  const THEME = {
    stone: { bg: C.INK, edge: C.WHITE, frame: C.MARB5, fg: C.WHITE, hl: C.SUN, sub: C.MARB2, eye: C.SKY3, rule: 0, btn: C.WHITE, btnFg: C.INK },
    paper: { bg: C.PAPER, edge: C.BROWN, frame: C.BROWN2, fg: C.BROWN, hl: C.REDD, sub: C.BROWN2, eye: C.BROWN2, rule: C.PAPER2, btn: C.BROWN, btnFg: C.PAPER },
  };
  function overlaySpec() {
    if (overlay === "intro") return { th: "stone", w: 392, eye: "셋째 날 · 천사의 고원", title: "천사가 내려온다", btn: ["startBtn", "일지를 덮고 일어선다"],
      rules: ["빛의 울타리 안에서 <b>빛을 피하세요.</b> 맞는 곳은 로타 발밑의 빨간 점뿐이에요.", "빛이 스치면 로타의 그림자가 반대쪽으로 뻗어요. 그림자가 <b>바닥에 드리운 천사의 그림자</b>에 닿으면 천사를 쳐요.", "피하기만 해도 돼요. 한 차례를 버틸 때마다 천사의 빛이 바래요.", "차례 사이에 <b>일지</b>를 펴거나 <b>하늘</b>을 보며 숨을 고를 수 있어요."],
      keys: touch ? [["화면 끌기", "끈 만큼 움직임"]] : [["방향키 / WASD", "이동, 행동 고르기"], ["Shift", "천천히 움직이기"], ["Z / Enter", "정하기, 글 넘기기"]] };
    if (overlay === "journal") { const p = PATTERNS[nextKey]; return { th: "paper", w: 320, eye: "카엘룸의 일지", title: p.name + "에 관하여", body: p.page, aside: "이번 차례에는 그림자가 가야 할 길과 빛의 길이 점선으로 보여요. 남은 장 " + jUses + "장.", btn: ["jClose", "일지를 덮고 맞선다"] }; }
    if (overlay === "lose") return { th: "stone", w: 290, eye: "로타가 쓰러졌다", title: "빛이 너무 밝았다", body: ["다시 일어나게. 빛이 있는 한 그림자도 있다네."], btn: ["retryBtn", "이 차례부터 다시"] };
    return { th: "paper", w: 320, eye: "그날 밤 · 로타는 맹세를 깨고 일지를 넘겼다", title: "괴물에 관하여", body: ["천사를 넘었다면, 남은 것은 정상뿐이네.", "괴물은 천사보다 훨씬 약하니 걱정 말게.", "<b>너도 꼭, 나와 같이 하늘 같은 자가 되길.</b>"], aside: winStat, btn: ["againBtn", "처음부터 다시"] };
  }
  function drawOverlay() {
    if (!overlay) return;
    rect(-OX, 0, FW, FH, C.INK, 10);
    const sp = overlaySpec(), th = THEME[sp.th], w = sp.w, x = Math.round((CW - w) / 2), ix = x + 9, iw = w - 18;
    const eye = wrap(sp.eye, iw, F9), tsc = textW(sp.title, F11, 2) <= iw ? 2 : 1;
    const body = (sp.body || []).map((s) => wrap(s, iw - 6, F11)), rules = (sp.rules || []).map((s) => wrap(s, iw - 9, F9));
    const aside = sp.aside ? wrap(sp.aside, iw, F9) : [], keyRows = sp.keys ? Math.ceil(sp.keys.length / 2) : 0;
    let h = 7 + eye.length * 12 + 1 + 11 * tsc + 8;
    body.forEach((l) => (h += l.length * 15 + 3)); rules.forEach((l) => (h += l.length * 12 + 3));
    if (keyRows) h += 5 + keyRows * 12;
    if (aside.length) h += 2 + aside.length * 12;
    h += 6 + 19 + 7;
    let y = Math.max(2, Math.round((FH - h) / 2));
    slab(x, y, w, h, th.bg, th.edge); frame(x + 2, y + 2, w - 4, h - 4, th.frame);
    y += 7;
    drawLines(eye, ix, y, F9, 12, th.eye, th.eye); y += eye.length * 12 + 1;
    text(sp.title, ix, y, th.fg, F11, tsc); y += 11 * tsc + 3;
    rect(ix, y, iw, 1, th.frame); y += 5;
    for (const l of body) {
      if (th.rule) for (let i = 0; i < l.length; i++) rect(ix, y + 12 + i * 15, iw, 1, th.rule);
      rect(ix, y, 2, l.length * 15 - 4, th.hl);
      drawLines(l, ix + 6, y, F11, 15, th.fg, th.hl); y += l.length * 15 + 3;
    }
    for (const l of rules) { soul(ix, y + 2); drawLines(l, ix + 9, y, F9, 12, th.fg, th.hl); y += l.length * 12 + 3; }
    if (keyRows) {
      rect(ix, y, iw, 1, th.frame); y += 5;
      sp.keys.forEach(([k, d], i) => { const kx = ix + (i & 1) * Math.round(iw / 2), ky = y + (i >> 1) * 12; const ex = text(k, kx, ky, th.fg, F9); text(d, ex + 6, ky, th.sub, F9); });
      y += keyRows * 12;
    }
    if (aside.length) { y += 2; drawLines(aside, ix, y, F9, 12, th.sub, th.sub); y += aside.length * 12; }
    y += 6;
    const [id, label] = sp.btn, foc = focused(id);
    slab(ix, y, iw, 19, th.btn, th.edge);
    textC(label, ix + iw / 2, y + 4, th.btnFg, F11);
    if (foc && Math.floor(performance.now() / 350) % 2) soul(Math.round(ix + iw / 2 - textW(label, F11) / 2) - 11, y + 7);
    place(id, ix, y, iw, 20);
  }
  function drawUI() {
    ui.d.fill(0); target(ui, OX);
    drawTexts(); drawHud(); drawOverlay(); endPlace();
    const d = ui.d; for (let i = 0; i < d.length; i++) uout[i] = pal32[d[i]];
    uctx.putImageData(uimg, 0, 0);
  }

  // ---------- Loop ----------
  let last = 0, blipN = 0;
  function tick(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000 || 0); last = now;
    for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; t.t -= dt; if (t.t <= 0) { timers.splice(i, 1); t.fn(); } }
    if (freeze > 0) freeze -= dt; else step(dt);
    shake = Math.max(0, shake - dt * 1.2);
    impact = Math.max(0, impact - dt);
    A.flash = Math.max(0, A.flash - dt * 4);
    if (A.ghostT > 0) A.ghostT -= dt; else A.ghost = Math.max(A.hp, A.ghost - 40 * dt);
    if (sayN < sayTotal) { const b = Math.floor(sayN / 3); sayN = Math.min(sayTotal, sayN + dt * 38); if (Math.floor(sayN / 3) !== b && ++blipN) sfx.blip(); }
    render3D(freeze > 0 ? 0 : dt);
    drawUI();
    requestAnimationFrame(tick);
  }
  addEventListener("resize", resize);
  resize();
  loadWorld(["plateau.glb", "../../assets/mountain/plateau.glb"]);
  requestAnimationFrame((t) => { last = t; tick(t); });
  window.__game = { get state() { return state; }, A, P, set(o) { if (o.turn !== undefined) turn = o.turn; if (o.ahp !== undefined) { A.hp = A.ghost = o.ahp; angelDamageLook(); } if (o.php !== undefined) P.hp = o.php; } };
}
})();
