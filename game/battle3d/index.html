<title>천사의 고원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the 3D plateau fills a 16:9 landscape field. The angel hangs fixed above the far side of a box of light on
   the floor; Rota dodges inside the box. The 3D is drawn at the screen's own resolution; the interface is drawn in hard
   pixels on a 480x270 canvas above it: angel's light top left, talk panel bottom left, the three actions bottom right.
   Palette rule: gold is light, ink navy is shadow and panels, red is Rota. */
:root {
  --night: #0e1230;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--night); color: #f6f8ff; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage {
  position: fixed; inset: 0; box-sizing: border-box;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: none;
}
#field { position: absolute; }
#gl, #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { image-rendering: pixelated; }
.hit { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; font-size: 1px; overflow: hidden; cursor: pointer; outline: none; }
.hit:disabled { cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>

<div id="stage">
  <div id="field">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="ui" width="480" height="270" role="img" aria-label="전투 화면"></canvas>
    <button class="hit" id="snd" type="button" hidden>소리 끄기</button>
    <button class="hit" id="actFight" type="button" data-act="fight" hidden>맞선다</button>
    <button class="hit" id="actJournal" type="button" data-act="journal" hidden>일지 펴기</button>
    <button class="hit" id="actSky" type="button" data-act="sky" hidden>하늘 보기</button>
    <button class="hit" id="startBtn" type="button" hidden>일지를 덮고 일어선다</button>
    <button class="hit" id="jClose" type="button" hidden>일지를 덮고 맞선다</button>
    <button class="hit" id="retryBtn" type="button" hidden>이 차례부터 다시</button>
    <button class="hit" id="againBtn" type="button" hidden>처음부터 다시</button>
  </div>
</div>
<p class="sr" id="say" aria-live="polite"></p>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // font.js sits next to the page when published; in the repository it lives with the pixel demo
  function loadScript(srcs, ok, fail) {
    const s = document.createElement("script"); s.charset = "utf-8"; s.src = srcs[0]; s.onload = ok;
    s.onerror = () => (srcs.length > 1 ? loadScript(srcs.slice(1), ok, fail) : fail());
    document.head.appendChild(s);
  }
  function boot() { loadScript(["font.js", "../demo/font.js"], start, () => { $("say").textContent = "글꼴을 불러오지 못했어요. 새로고침해 주세요."; }); }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();

function start() {
  // The simulation runs on the floor in logical units (the box B is 360 x 232 of them); MS turns them into metres.
  // The angel hangs above the point (MX, AY), 5.4 m behind the box's centre, and never moves from there.
  const FH = 270, CW = 480, TAU = Math.PI * 2;
  let FW = CW, OX = 0;
  const Q = new URLSearchParams(location.search);
  const qv = (k, d) => (Q.has(k) ? Q.get(k).split(",").map(Number) : d);
  const B = { x: 276, y: 196, w: 360, h: 232 };
  const MX = B.x + B.w / 2, BCY = B.y + B.h / 2;
  const MS = 0.024;
  const AY = BCY - +(Q.get("ay") || 145);
  const LIFT = +(Q.get("lift") || 2.3);              // how high the angel's hem floats above the floor, metres
  const G = 62, AHIT = 64, PMAX = 6, ENDURE = 10, ENDURE_FINAL = 15;
  const wx = (x) => (x - MX) * MS, wz = (y) => (y - BCY) * MS;
  const lx = (X) => MX + X / MS, ly = (Z) => BCY + Z / MS;
  const EXPO = +(Q.get("expo") || 0.85), ENV = +(Q.get("env") || 0.9);
  const CAM = { pos: qv("cam", [0, 4.4, 9.6]), look: qv("look", [0, 3.1, -3.0]), fov: +(Q.get("fov") || 58) };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const stageEl = $("stage"), fieldEl = $("field"), glEl = $("gl"), uiEl = $("ui"), srEl = $("say"), uctx = uiEl.getContext("2d");

  // ---------- Interface palette (the world itself is 3D) ----------
  const PAL = ["#000000", "#12163a", "#232c66", "#3558b8", "#f6f8ff", "#cdd6f1", "#9aa8dc", "#6f7dbd", "#55629f", "#3f4a82",
    "#ffd257", "#fff1b0", "#fffbe6", "#f0932e", "#df4b43", "#ff9a86", "#f2e4c0", "#dcc89a", "#5a3a2a", "#96603c", "#9c2a35", "#6ea2e4"];
  const C = {};
  ["", "INK", "DEEP", "BLUE", "WHITE", "MARB1", "MARB2", "MARB3", "MARB4", "MARB5", "SUN", "SUNP", "SUNC", "ORNG", "RED", "PINK",
    "PAPER", "PAPER2", "BROWN", "BROWN2", "REDD", "SKY3"].forEach((n, i) => { if (n) C[n] = i; });
  const pal32 = new Uint32Array(PAL.map((h, i) => (i === 0 ? 0 : (0xff000000 | (parseInt(h.slice(5, 7), 16) << 16) | (parseInt(h.slice(3, 5), 16) << 8) | parseInt(h.slice(1, 3), 16)) >>> 0)));

  // ---------- Pixel surface ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const surf = (w, h) => ({ w, h, d: new Uint8Array(w * h) });
  let S = null, OFX = 0, cx0 = 0, cy0 = 0, cx1 = 0, cy1 = 0;
  function target(s, ofx) { S = s; OFX = ofx || 0; cx0 = 0; cy0 = 0; cx1 = s.w; cy1 = s.h; }
  function px(x, y, c) { x += OFX; if (x >= cx0 && x < cx1 && y >= cy0 && y < cy1) S.d[y * S.w + x] = c; }
  // lv: dither level 1..16 (16 or undefined = solid)
  function rect(x, y, w, h, c, lv) {
    x = Math.round(x) + OFX; y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const x0 = Math.max(cx0, x), y0 = Math.max(cy0, y), x1 = Math.min(cx1, x + w), y1 = Math.min(cy1, y + h), d = S.d, sw = S.w;
    if (lv === undefined || lv >= 16) { for (let yy = y0; yy < y1; yy++) d.fill(c, yy * sw + x0, yy * sw + Math.max(x0, x1)); return; }
    for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) if (BAYER[(yy & 3) * 4 + (xx & 3)] < lv) d[yy * sw + xx] = c;
  }
  function frame(x, y, w, h, c) { rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
  // o.tint: draw every opaque pixel in one colour. o.lv: dither level.
  function blit(sp, x, y, o) {
    x = Math.round(x) + OFX; y = Math.round(y);
    const tint = o && o.tint, lv = o && o.lv, d = S.d, sw = S.w, sd = sp.d, w = sp.w;
    for (let yy = 0; yy < sp.h; yy++) {
      const ty = y + yy; if (ty < cy0 || ty >= cy1) continue;
      for (let xx = 0; xx < w; xx++) {
        const c = sd[yy * w + xx]; if (!c) continue;
        const tx = x + xx; if (tx < cx0 || tx >= cx1) continue;
        if (lv !== undefined && BAYER[(ty & 3) * 4 + (tx & 3)] >= lv) continue;
        d[ty * sw + tx] = tint || c;
      }
    }
  }
  function spr(rows, map) {
    const s = surf(rows[0].length, rows.length);
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) s.d[y * s.w + x] = map[r[x]] || 0; });
    return s;
  }

  // ---------- Pixel font (Galmuri, see font.js) ----------
  function mkFont(src, cap, pitch) {
    const idx = new Map(), recs = src.data.split(" "), cache = new Map();
    Array.from(src.chars).forEach((ch, i) => idx.set(ch, i));
    const f = { cap, pitch, glyph(ch) {
      let g = cache.get(ch); if (g) return g;
      const i = idx.get(ch); if (i === undefined) return ch === "?" ? null : f.glyph("?");
      const r = recs[i], bin = atob(r.slice(5));
      g = { adv: r.charCodeAt(0) - 48, w: r.charCodeAt(1) - 48, h: r.charCodeAt(2) - 48, xo: r.charCodeAt(3) - 56, yo: r.charCodeAt(4) - 56, bin };
      cache.set(ch, g); return g;
    } };
    return f;
  }
  const F11 = mkFont(window.GAME_FONTS.f11, 11, 14), F9 = mkFont(window.GAME_FONTS.f9, 9, 12);
  function textW(str, f, sc) { let w = 0; for (const ch of str) { const g = f.glyph(ch); if (g) w += g.adv; } return (w - 1) * (sc || 1); }
  function glyphAt(g, x, base, c, sc) {
    for (let r = 0, i = 0; r < g.h; r++) for (let k = 0; k < g.w; k++, i++) {
      if (g.bin.charCodeAt(i >> 3) & (0x80 >> (i & 7))) { if (sc === 1) px(x + g.xo + k, base - g.yo - g.h + r, c); else rect(x + (g.xo + k) * sc, base - (g.yo + g.h - r) * sc, sc, sc, c); }
    }
  }
  // y is the top of a capital/Hangul glyph
  function text(str, x, y, c, f, sc) {
    sc = sc || 1; x = Math.round(x); y = Math.round(y);
    for (const ch of str) { const g = f.glyph(ch); if (!g) continue; glyphAt(g, x, y + f.cap * sc, c, sc); x += g.adv * sc; }
    return x;
  }
  function textO(str, x, y, c, oc, f, sc) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) text(str, x + dx, y + dy, oc, f, sc);
    text(str, x, y, c, f, sc);
  }
  const textC = (str, cx, y, c, f, sc) => text(str, cx - textW(str, f, sc) / 2, y, c, f, sc);
  const textCO = (str, cx, y, c, oc, f, sc) => textO(str, Math.round(cx - textW(str, f, sc) / 2), y, c, oc, f, sc);
  // "<b>..</b>" marks emphasis. Returns lines of cells {ch, hl}; wraps at spaces, falls back to breaking a long word.
  function wrap(str, maxW, f) {
    const cells = []; let hl = false;
    for (let i = 0; i < str.length; i++) {
      if (str.startsWith("<b>", i)) { hl = true; i += 2; continue; }
      if (str.startsWith("</b>", i)) { hl = false; i += 3; continue; }
      cells.push({ ch: str[i], hl });
    }
    const adv = (c) => { const g = f.glyph(c.ch); return g ? g.adv : 0; };
    const lines = [[]]; let w = 0, i = 0;
    while (i < cells.length) {
      const cur = lines[lines.length - 1];
      if (cells[i].ch === " ") { if (cur.length) { cur.push(cells[i]); w += adv(cells[i]); } i++; continue; }
      let j = i, ww = 0; while (j < cells.length && cells[j].ch !== " ") { ww += adv(cells[j]); j++; }
      if (w + ww > maxW && cur.length) { lines.push([]); w = 0; continue; }
      if (ww > maxW) { for (; i < j; i++) { if (w + adv(cells[i]) > maxW) { lines.push([]); w = 0; } lines[lines.length - 1].push(cells[i]); w += adv(cells[i]); } continue; }
      for (; i < j; i++) cur.push(cells[i]);
      w += ww;
    }
    return lines;
  }
  function drawLines(lines, x, y, f, pitch, c, hc, limit) {
    let n = 0;
    for (const ln of lines) {
      let xx = x;
      for (const cell of ln) { if (limit !== undefined && n >= limit) return n; const g = f.glyph(cell.ch); if (g) { glyphAt(g, xx, y + f.cap, cell.hl ? hc : c, 1); xx += g.adv; } n++; }
      y += pitch;
    }
    return n;
  }

  // ---------- Layout ----------
  let cssPx = 1, rot = false, ui = null, uimg = null, uout = null, glW = 0, glH = 0;
  let touch = matchMedia("(pointer: coarse)").matches;
  function resize() {
    const cs = getComputedStyle(stageEl);
    const pl = parseFloat(cs.paddingLeft), pt = parseFloat(cs.paddingTop);
    let aw = stageEl.clientWidth - pl - parseFloat(cs.paddingRight), ah = stageEl.clientHeight - pt - parseFloat(cs.paddingBottom);
    const midX = pl + aw / 2, midY = pt + ah / 2;
    rot = touch && ah > aw * 1.15;            // a phone held upright shows the game turned on its side
    if (rot) [aw, ah] = [ah, aw];
    const fw = clamp(Math.round((FH * aw) / ah / 2) * 2, CW, 640);   // wider screens see more of the plateau, same fight
    if (fw !== FW || !ui) {
      FW = fw; OX = (FW - CW) / 2;
      ui = surf(FW, FH); uiEl.width = FW; uiEl.height = FH;
      uimg = uctx.createImageData(FW, FH); uout = new Uint32Array(uimg.data.buffer);
      cam.aspect = FW / FH; cam.updateProjectionMatrix();
      for (const id in hitEls) hitEls[id].key = "";
    }
    const dpr = window.devicePixelRatio || 1, s = Math.min(aw / FW, ah / FH), k = Math.floor(s * dpr);
    cssPx = k >= 2 && k / (s * dpr) >= 0.85 ? k / dpr : s;
    Object.assign(fieldEl.style, { width: FW * cssPx + "px", height: FH * cssPx + "px", left: midX - (FW * cssPx) / 2 + "px", top: midY - (FH * cssPx) / 2 + "px", transform: rot ? "rotate(90deg)" : "" });
    // the 3D is drawn at the screen's own sharpness, up to 1.5 device pixels per CSS pixel
    const q = Math.min(dpr, 1.5), w = Math.max(CW, Math.round(FW * cssPx * q)), h = Math.max(FH, Math.round(FH * cssPx * q));
    if (w !== glW || h !== glH) { glW = w; glH = h; renderer.setSize(w, h, false); }
  }

  // ---------- Sound (square waves and noise, like an old console, over a low hum the angel gives off) ----------
  let ac = null, muted = false, drone = null;
  function audioOn() {
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) { ac = null; }
  }
  function tone(f0, f1, dur, type, vol, delay) {
    if (!ac || muted) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf = null;
  function noise(dur, vol, freq) {
    if (!ac || muted) return;
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.4, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
  }
  let droneWant = 1;
  function droneLevel(v, sec) {
    droneWant = v;
    if (!ac) return;
    if (!drone) {
      const g = ac.createGain(), f = ac.createBiquadFilter(); g.gain.value = 0; f.type = "lowpass"; f.frequency.value = 380;
      f.connect(g).connect(ac.destination);
      [55, 82.4, 110.3].forEach((hz, i) => { const o = ac.createOscillator(); o.type = i === 2 ? "triangle" : "sine"; o.frequency.value = hz; o.detune.value = (i - 1) * 7; o.connect(f); o.start(); });
      drone = g;
    }
    const t = ac.currentTime; drone.gain.cancelScheduledValues(t); drone.gain.setValueAtTime(drone.gain.value, t);
    drone.gain.linearRampToValueAtTime(muted ? 0 : v * 0.05, t + (sec || 0.5));
  }
  const sfx = {
    strike(s, c) { const up = 1 + Math.min(c, 8) * 0.08; noise(0.1 + 0.08 * s, 0.3 + 0.3 * s, 700); tone(190, 45, 0.16 + 0.1 * s, "square", 0.1 + 0.08 * s); tone(520 * up, 780 * up, 0.09, "square", 0.05, 0.04); },
    tick() { tone(240, 150, 0.06, "square", 0.04); },
    hurt() { tone(220, 55, 0.28, "square", 0.09); noise(0.2, 0.2, 400); },
    select() { tone(660, 660, 0.04, "square", 0.035); },
    blip() { tone(420, 400, 0.03, "square", 0.018); },
    turn() { tone(660, 660, 0.09, "square", 0.04); tone(990, 990, 0.16, "square", 0.04, 0.09); },
    heal() { tone(520, 520, 0.08, "square", 0.04); tone(660, 660, 0.08, "square", 0.04, 0.08); tone(780, 780, 0.16, "square", 0.04, 0.16); },
    page() { noise(0.22, 0.12, 2400); },
    charge() { tone(110, 420, 0.9, "sawtooth", 0.025); },
    beam() { noise(0.7, 0.28, 900); tone(330, 140, 0.7, "square", 0.05); },
    ray() { tone(880, 880, 0.3, "triangle", 0.035); tone(1320, 1320, 0.4, "triangle", 0.025, 0.08); },
    open() { tone(1320, 1320, 0.12, "triangle", 0.035); tone(1760, 1760, 0.22, "triangle", 0.03, 0.07); noise(0.25, 0.08, 3200); },
    drop() { tone(1500, 900, 0.06, "triangle", 0.012); },
    burn() { noise(1.3, 0.35, 280); tone(75, 48, 1.3, "sawtooth", 0.06); },
    pop() { tone(900, 300, 0.12, "square", 0.03); },
    gaze() { tone(98, 98, 1.4, "sawtooth", 0.05); tone(147, 147, 1.4, "sawtooth", 0.035, 0.1); noise(0.6, 0.1, 160); },
  };

  // ---------- State ----------
  const P = { x: MX, y: B.y + B.h * 0.72, hp: PMAX, inv: 0, focus: false, face: Math.PI, moving: 0 };
  const A = { x: MX, y: AY, hp: 100, ghost: 100, ghostT: 0, flash: 0, dying: 0, jolt: 0 };
  let L = [], texts = [], shadows = [], timers = [];
  let state = "loading", overlay = null, simT = 0, freeze = 0, shake = 0, impact = 0, lastImpact = -9, loadPct = 0, loadErr = "";
  let turn = 0, T = null, pat = null, nextKey = null, forceKey = null, tele = false, finaleSeen = false, lookedOnce = false;
  let combo = 0, lastStrike = -9, turnHits = 0, totalHits = 0, bestCombo = 0, penAcc = 0;
  let jUses = 3, sUses = 2, snap = null, winStat = "";
  const after = (d, fn) => timers.push({ t: d, fn });

  // What the angel's body is doing, set by the patterns and read when the model is drawn.
  // AW holds world positions taken from the model each frame (metres); the patterns read them to know where a light leaves from.
  const AW = { eye: new THREE.Vector3(0, LIFT + 3.7, -5.4), eyeR: 1.2, root: new THREE.Vector3(0, LIFT, -5.4), ring: new THREE.Vector3(), ringN: new THREE.Vector3(0, 1, 0), ringR: 2.04 };
  const RING_IDLE = TAU / 14;
  let ringPhase = 0, ringW = RING_IDLE, ringWant = RING_IDLE, wingRaise = 0, wingRaiseWant = 0, eyeAim = null, glance = 0, glanceCd = 6;
  // the ring's twelve eyes throw thin rays across the floor; st 0 off, 1 warning (harmless), 2 live
  const RAYS = { st: 0, show: 0, ox: MX, oy: AY, dirs: Array.from({ length: 12 }, () => ({ ux: 0, uy: 1 })) };
  // the light behind the angel climbs; everything but the angel's own shadow burns
  const SHADE = { on: false, lit: 0, burn: 0, sx: MX, sy: BCY, L: new THREE.Vector3(), vis: 0, safe: false };

  function orb(x, y, vx, vy, r) { const b = { k: "orb", x, y, vx, vy, r: r || 7, best: 0, struck: false, fade: 0 }; L.push(b); return b; }
  // a light let fall from a point on the angel (a world position): it flies down to (tx, ty) on the floor, harmless in
  // the air, and slides on in the same direction once it lands
  function drop(src, tx, ty, flight, speed, r) {
    const sx = lx(src.x), sy = ly(src.z), dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1;
    L.push({ k: "orb", x: sx, y: sy, h: src.y - Y0, air: { sx, sy, sh: src.y - Y0, tx, ty, t: 0, T: flight }, vx: (dx / d) * speed, vy: (dy / d) * speed, r: r || 7, best: 0, struck: false, fade: 0 });
    sfx.drop();
  }
  const activeBeam = () => L.find((s) => s.k === "beam" && !s.fade);
  // the central eye looks at a strip of floor; after aimT a wide beam lands there and sweeps to x1 over fireT
  function halfSweep(onLeft, aimT, fireT, sparkEvery) {
    const w = 84, x0 = onLeft ? B.x + w / 2 - 4 : B.x + B.w - w / 2 + 4, x1 = MX + (onLeft ? 6 : -6);
    L.push({ k: "beam", x: x0, x0, x1, w, t: 0, aimT, fireT, ph: 0, fade: 0, spark: 0, sparkEvery: sparkEvery || 0.3 });
    sfx.charge();
  }
  function lighthouseRun(T, dt, lvl, k) {

  const ICON = { "#": C.WHITE };
  const icoOn = spr(["...#.....", "..##..#..", "####...#.", "####.#.#.", "####...#.", "..##..#..", "...#....."], ICON);

  function drawTexts() {

      const age = t.max - t.life;

  }
  function drawHud() {
    if (state === "loading") {
      const ks = Object.keys(prog), p = ks.length ? ks.reduce((a, k) => a + prog[k], 0) / 3 : 0;
      const msg = loadErr || "고원으로 오르는 중 " + Math.round(p * 100) + "%";

      if (sayLay && (tele || state !== "pattern")) {
        const n = sayLay.reduce((m, l) => m + l.length, 0), hh = n * 12 + 8;
        slab(lx_, 30, 132, hh, C.INK, C.WHITE);

  }
  const THEME = {
    stone: { bg: C.INK, edge: C.WHITE, frame: C.MARB5, fg: C.WHITE, hl: C.SUN, sub: C.MARB2, eye: C.SKY3, rule: 0, btn: C.WHITE, btnFg: C.INK },

  function overlaySpec() {
    if (overlay === "intro") return { th: "stone", w: 392, eye: "셋째 날 · 천사의 고원", title: "천사가 내려온다", btn: ["startBtn", "일지를 덮고 일어선다"],
      rules: ["빛의 울타리 안에서 <b>빛을 피하세요.</b> 맞는 곳은 로타 발밑의 빨간 점뿐이에요.", "빛이 곁을 스쳐 지나가면 로타의 그림자가 반대쪽으로 뻗어요. 그림자가 <b>천사의 발치</b>에 닿으면 천사를 쳐요.", "피하기만 해도 돼요. 한 차례를 버틸 때마다 천사의 빛이 바래고 날개의 눈이 감겨요.", "차례 사이에 <b>일지</b>를 펴거나 <b>하늘</b>을 보며 숨을 고를 수 있어요."],
      keys: touch ? [["화면 끌기", "끈 만큼 움직임"]] : [["방향키 / WASD", "이동, 행동 고르기"], ["Shift", "천천히 움직이기"], ["Z / Enter", "정하기, 글 넘기기"]] };
    if (overlay === "journal") { const p = PATTERNS[nextKey]; return { th: "paper", w: 320, eye: "카엘룸의 일지", title: p.name + "에 관하여", body: p.page, aside: "이번 차례에는 그림자가 가야 할 길과 빛의 길이 점선으로 보여요. 남은 장 " + jUses + "장.", btn: ["jClose", "일지를 덮고 맞선다"] }; }
    if (overlay === "lose") return { th: "stone", w: 290, eye: "로타가 쓰러졌다", title: "빛이 너무 밝았다", body: ["다시 일어나게. 빛이 있는 한 그림자도 있다네."], btn: ["retryBtn", "이 차례부터 다시"] };

  }
  function drawOverlay() {
    if (!overlay) return;
    rect(-OX, 0, FW, FH, C.INK, overlay === "intro" ? 7 : 10);
    const sp = overlaySpec(), th = THEME[sp.th], w = sp.w, x = Math.round((CW - w) / 2), ix = x + 9, iw = w - 18;
    const eye = wrap(sp.eye, iw, F9), tsc = textW(sp.title, F11, 2) <= iw ? 2 : 1;

  // ---------- Loop ----------
  let last = 0, blipN = 0;

    if (freeze > 0) freeze -= dt; else step(dt);

    if (sayN < sayTotal) { const b = Math.floor(sayN / 3); sayN = Math.min(sayTotal, sayN + dt * 38); if (Math.floor(sayN / 3) !== b && ++blipN) sfx.blip(); }

  // for testing: __game.set({ next: "shade" }) makes every turn that pattern

    set(o) { if (o.turn !== undefined) turn = o.turn; if (o.ahp !== undefined) { A.hp = A.ghost = o.ahp; angelDamageLook(); } if (o.php !== undefined) P.hp = o.php; if (o.next !== undefined) forceKey = o.next; if (o.inv !== undefined) P.inv = o.inv; } };
